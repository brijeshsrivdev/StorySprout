services:
  postgres:
    image: postgres:18
    container_name: storysprout-postgres
    environment:
      POSTGRES_DB: storysprout
      POSTGRES_USER: storysprout
      POSTGRES_PASSWORD: storysprout
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storysprout -d storysprout"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: storysprout-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: storysprout
      MINIO_ROOT_PASSWORD: storysprout
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
