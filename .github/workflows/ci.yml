name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --workspaces --include-workspace-root
        working-directory: .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -Dmaven.multiModuleProjectDirectory=$PWD -q compile
      - run: ./mvnw -Dmaven.multiModuleProjectDirectory=$PWD -q test

  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --workspaces --include-workspace-root
      - run: npm --workspace services/renderer run typecheck
      - run: npm --workspace services/renderer run test
      - run: npm --workspace services/renderer run build

  e2e:
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --workspaces --include-workspace-root
      - run: npx playwright install chromium
      - run: docker compose up -d postgres minio renderer
      - run: |
          for i in {1..60}; do
            if docker compose exec -T postgres pg_isready -U storysprout -d storysprout; then
              exit 0
            fi
            sleep 1
          done
          echo 'Timed out waiting for PostgreSQL container to become ready.'
          docker compose ps
          docker compose logs postgres
          exit 1
      - run: chmod +x mvnw && ./mvnw -Dmaven.multiModuleProjectDirectory=$PWD -q spring-boot:run > /tmp/storysprout-api.log 2>&1 &
        working-directory: apps/api
      - run: npm run dev > /tmp/storysprout-web.log 2>&1 &
        working-directory: apps/web
      - run: |
          for i in {1..60}; do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/api/v1/health; then
              exit 0
            fi
            sleep 2
          done
          echo 'Timed out waiting for StorySprout API health endpoint.'
          cat /tmp/storysprout-api.log
          exit 1
      - run: |
          for i in {1..60}; do
            if curl -fsS --max-time 2 http://127.0.0.1:4000/health; then
              exit 0
            fi
            sleep 2
          done
          echo 'Timed out waiting for StorySprout renderer.'
          docker compose logs renderer
          exit 1
      - run: |
          for i in {1..60}; do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 2
          done
          echo 'Timed out waiting for StorySprout web server.'
          cat /tmp/storysprout-web.log
          exit 1
      - run: npm --workspace apps/web run test:e2e
      - name: Dump E2E server logs on failure
        if: failure()
        run: |
          echo '--- API log ---'
          cat /tmp/storysprout-api.log || true
          echo '--- Web log ---'
          cat /tmp/storysprout-web.log || true
